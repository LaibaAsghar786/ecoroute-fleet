<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoRoute Prototype v5</title>
<style>
:root{--g:#0B6E4F;--g2:#0F7F73;--am:#F5A524;--bg:#F4F7F6;--cd:#fff;--bd:#E1E8E5;--tx:#1B2B27;--mu:#5F6F6A;--rd:#D64545;--bl:#2B7BD6;--sh:0 8px 28px rgba(23,54,43,.07);--gr:linear-gradient(135deg,#0A5C44,#0F7F73);--soft:#EAF5F0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A17;--cd:#16241F;--bd:#25382F;--tx:#E6F0EC;--mu:#9DB0A8;--soft:#1D3A2F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A17;--cd:#16241F;--bd:#25382F;--tx:#E6F0EC;--mu:#9DB0A8;--soft:#1D3A2F;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
.top{display:flex;justify-content:center;gap:8px;padding:10px;background:var(--gr)}.top button{padding:8px 20px;border-radius:99px;background:#ffffff30;color:#fff;font-weight:700}.top .on{background:#fff;color:var(--g)}
.shell{display:flex;min-height:calc(100vh - 56px)}.sb{width:228px;background:var(--cd);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;font-weight:800;font-size:17px}.brand small{display:block;font-weight:400;font-size:11px;color:var(--mu)}.logo{width:38px;height:38px;border-radius:12px;background:var(--gr);display:grid;place-items:center;color:#fff}
.nl{font-size:10px;color:var(--mu);font-weight:800;letter-spacing:1.3px;padding:12px 10px 6px}
.nv{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;margin:2px 0;border-radius:10px;background:none;color:var(--mu);text-align:left}.nv.on{background:var(--soft);color:var(--g);font-weight:700}.nv:hover{background:var(--soft)}
.mn{flex:1;min-width:0}.tb{height:60px;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.ct{max-width:1300px;margin:auto;padding:24px}.ft{text-align:center;color:var(--mu);font-size:11px;padding:14px}
.eb{color:var(--g);font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}h1{font-size:26px;margin:4px 0;letter-spacing:-.6px}h2{font-size:16px;margin:0 0 4px}.mu{color:var(--mu);font-size:12px}
.hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.gd{display:grid;gap:14px;margin-bottom:14px}.k{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.t2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh);min-width:0}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}.kv{font-size:28px;font-weight:800;letter-spacing:-1px;margin:10px 0 2px}
.hero{background:var(--gr);color:#fff;border-radius:14px;padding:18px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:190px;height:190px;border:1px solid #ffffff30;border-radius:50%;right:-50px;top:-70px}.hero .mu{color:#C5E6D9}
.btn{padding:10px 16px;border-radius:10px;background:var(--g);color:#fff;font-weight:700}.btn.o{background:var(--cd);border:1px solid var(--bd);color:var(--tx)}.btn.am{background:var(--am);color:#3D2B04}.btn.rd{background:var(--rd);color:#fff}.btn.w{width:100%;padding:14px;font-size:15px}
.pl{display:inline-block;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;background:#E1F5EA;color:#1E7B4A}.pl.a{background:#FFF1D6;color:#8A5A00}.pl.r{background:#FDE4E4;color:#B23232}.pl.b{background:#E3EFFC;color:#1F5FA8}.pl.g{background:#ECEFEE;color:#5F6F6A}
table{width:100%;border-collapse:collapse}th{font-size:10px;color:var(--mu);letter-spacing:.8px;text-align:left}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);font-size:13px}tr.cl:hover{background:var(--soft);cursor:pointer}.tw{overflow-x:auto}
.ch{height:150px;display:flex;align-items:flex-end;gap:5px}.ch i{flex:1;background:linear-gradient(180deg,#29A879,var(--g));border-radius:5px 5px 1px 1px;min-height:3px}.ch i.h{background:var(--am)}
.pr{height:9px;border-radius:9px;background:var(--bd)}.pr b{display:block;height:100%;border-radius:9px;background:var(--gr)}
input,select{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);width:100%}label{font-size:12px;color:var(--mu);display:block;margin:10px 0 4px}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.lp{background:var(--gr);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center}.lp h1{font-size:38px}.lf{display:grid;place-items:center;padding:30px}.lf .cd{width:min(100%,380px)}
.ph{width:min(100%,390px);height:800px;margin:20px auto;border:10px solid #14221D;border-radius:42px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.hdr{background:var(--gr);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.hdr .pl{cursor:pointer}
.sc{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
.bn{display:flex;border-top:1px solid var(--bd);background:var(--cd)}.bn button{flex:1;padding:9px 2px;background:none;color:var(--mu);font-size:11px}.bn .on{color:var(--g);font-weight:800}
.ls{font-size:11px;text-align:center;color:var(--mu);padding:4px;background:var(--cd)}
.tg{width:44px;height:26px;border-radius:99px;background:var(--bd);position:relative;flex-shrink:0}.tg.on{background:var(--g)}.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on:after{left:21px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14221D;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp button{padding:15px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);font-size:20px;font-weight:700}
.map{height:340px;border-radius:12px;position:relative;background:linear-gradient(135deg,#DCEFE7,#EAF2F8);overflow:hidden;background-image:linear-gradient(#ffffff90 2px,transparent 2px),linear-gradient(90deg,#ffffff90 2px,transparent 2px);background-size:60px 60px}.mk{position:absolute;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0004}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:8px 14px;border-radius:99px;background:var(--cd);border:1px solid var(--bd)}.tabs .on{background:var(--g);color:#fff;border-color:var(--g)}
@media(max-width:820px){.shell{flex-direction:column}.sb{width:auto;flex-direction:row;overflow-x:auto;padding:8px}.nl,.brand,.sbb{display:none}.nv{width:auto;white-space:nowrap}.login{grid-template-columns:1fr}.lp{display:none}.ct{padding:14px}}

<style>
